<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Survey</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html#home" class="brand">
            <span class="brand-icon">✚</span>
            <span>
                <strong>HealthSurvey</strong>
                <small>Public Health Survey Platform</small>
            </span>
        </a>
        <nav class="nav-links">
            <a href="index.html#home">Home</a>
            <a href="index.html#surveys">Surveys</a>
            <a href="index.html#about">About Us</a>
        </nav>
    </header>

    <main class="survey-page">
        <section class="survey-form-card">
            <a class="back-link" href="index.html#surveys">← Back to surveys</a>
            <h1 id="surveyTitle">Survey</h1>
            <p class="survey-intro">Please choose one answer for each question.</p>

            <form id="surveyForm">
                <div id="questionList"></div>
                <button class="btn" type="submit">Submit Survey</button>
                <p id="surveyMessage" class="survey-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="footer">
        <a href="index.html#home" class="footer-brand">HealthSurvey</a>
        <p>Promoting health awareness through community feedback.</p>
        <p class="copyright">© 2026 Public Health Survey Platform | Student Project</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
